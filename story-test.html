<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC ストーリーアニメ試作</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6fa;color:#202636;margin:0}.wrap{max-width:540px;margin:auto;padding:22px 16px}h1{font-size:21px;margin:8px 0}.sub{color:#647083;font-size:13px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 22px #16223812;margin-top:16px}.word{font-size:32px;font-weight:750}.meta{color:#637185;font-size:13px}.scene{background:#eaf3ff;border-radius:14px;overflow:hidden;margin:15px 0 8px}svg{width:100%;height:auto;display:block}.caption{font-weight:650;min-height:2.6em;text-align:center;margin:10px 0}.timeline{display:flex;gap:5px}.tick{flex:1;height:5px;border-radius:5px;background:#d7dfec}.tick.on{background:#3b78d8}.en{font-size:17px;font-weight:600;line-height:1.5}.ja{color:#5e6d82;margin-top:6px}button{border:0;background:#275dc2;color:white;border-radius:12px;padding:12px 16px;font-weight:650;font-size:15px;cursor:pointer}button.secondary{background:#e8eef8;color:#254d94}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.note{font-size:12px;color:#667487;margin-top:18px;line-height:1.6}svg text{font-family:-apple-system,BlinkMacSystemFont,sans-serif} .fade{transition:opacity .3s}.hidden{opacity:0}</style></head><body><main class="wrap"><h1>🎬 ストーリーで覚える英単語</h1><div class="sub">別ページの試作版・学習履歴にはアクセスしません</div><div class="card"><div id="word" class="word">confirm</div><div id="meta" class="meta">動詞 /kənˈfɝːm/ ・確認する</div><div class="scene"><svg viewBox="0 0 400 240" role="img" aria-label="ストーリーアニメーション"><rect width="400" height="240" fill="#eaf3ff"/><rect x="0" y="186" width="400" height="54" fill="#d9e5f0"/><g id="building"><rect x="228" y="34" width="155" height="154" rx="9" fill="#fff" stroke="#9ab1c7" stroke-width="3"/><rect x="242" y="48" width="127" height="30" rx="5" fill="#4e7baa"/><text id="sign" x="306" y="68" fill="white" font-size="15" font-weight="700" text-anchor="middle">HOTEL</text><rect x="255" y="106" width="100" height="14" rx="5" fill="#b9cce1"/><rect x="255" y="120" width="100" height="54" rx="4" fill="#7c9fbd"/></g><g id="guest" transform="translate(20,0)"><circle cx="0" cy="110" r="17" fill="#f0bc93"/><path d="M-19 156 Q-18 129 0 129 Q19 129 19 156 L19 182 L-19 182Z" fill="#e98b54"/><path d="M-9 182v21 M9 182v21" stroke="#42556f" stroke-width="9" stroke-linecap="round"/><circle cx="-5" cy="108" r="2" fill="#333"/><circle cx="5" cy="108" r="2" fill="#333"/></g><g id="clerk"><circle cx="306" cy="103" r="16" fill="#eab78e"/><path d="M285 146 Q285 120 306 120 Q327 120 327 146" fill="#4669aa"/><circle cx="301" cy="103" r="2" fill="#333"/><circle cx="311" cy="103" r="2" fill="#333"/></g><g id="screen" opacity="0"><rect x="260" y="126" width="92" height="60" rx="5" fill="#263a57"/><rect x="266" y="132" width="80" height="43" fill="#eaf7f2"/><text x="306" y="147" text-anchor="middle" font-size="9" fill="#365267">Reservation</text><path d="M283 157l8 8 15-18" fill="none" stroke="#21a66a" stroke-width="4" stroke-linecap="round"/></g><g id="bubble" opacity="0"><rect x="125" y="44" width="120" height="50" rx="13" fill="white" stroke="#adc1d5"/><path d="M213 93l12 16-2-16" fill="white" stroke="#adc1d5"/><text id="bubbletext" x="185" y="74" text-anchor="middle" font-size="14" fill="#284568" font-weight="700">Reservation?</text></g><g id="check" opacity="0"><circle cx="185" cy="115" r="26" fill="#2cad75"/><path d="M171 114l10 11 19-23" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div><div id="sceneText" class="caption">① お客さんがホテルへ向かう</div><div class="timeline"><div class="tick on"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div></div><div class="en" id="en">Please confirm your reservation by Friday.</div><div class="ja" id="ja">金曜日までに予約内容を確認してください。</div><div class="actions"><button id="replay">▶ 最初から再生</button><button id="speak" class="secondary">🔊 英文を聞く</button><button id="next" class="secondary">次の単語 →</button></div></div><p class="note">4つの場面を約8秒で再生します。人物が移動し、相手とやり取りし、行動の結果が出る構成です。既存の英単語アプリや学習履歴には影響しません。音声は端末の読み上げ機能を使用します。</p></main><script>
const words=[{w:'confirm',meta:'動詞 /kənˈfɝːm/ ・確認する',en:'Please confirm your reservation by Friday.',ja:'金曜日までに予約内容を確認してください。',sign:'HOTEL',steps:['① お客さんがホテルへ向かう','② 受付で予約について尋ねる','③ 受付係がパソコンで照合する','④ 予約が確認できて安心する'],bubble:'Reservation?'},{w:'purchase',meta:'動詞・名詞 /ˈpɝːtʃəs/ ・購入する／購入',en:'You can purchase tickets at the counter.',ja:'窓口でチケットを購入できます。',sign:'TICKETS',steps:['① お客さんがチケット売り場へ向かう','② 窓口でチケットを注文する','③ 店員がチケットを用意する','④ チケットを購入できた'],bubble:'One ticket!'},{w:'attend',meta:'動詞 /əˈtend/ ・出席する',en:'All employees must attend the meeting.',ja:'全従業員は会議に出席しなければなりません。',sign:'MEETING',steps:['① 社員が会議室へ向かう','② 会議室で参加を伝える','③ 出席者リストに名前を記録する','④ 出席が確認され会議に参加する'],bubble:'I am here!'}];let index=0,phase=0,timer;const $=id=>document.getElementById(id);function draw(){let d=words[index];$('word').textContent=d.w;$('meta').textContent=d.meta;$('en').textContent=d.en;$('ja').textContent=d.ja;$('sign').textContent=d.sign;$('bubbletext').textContent=d.bubble;$('sceneText').textContent=d.steps[phase];document.querySelectorAll('.tick').forEach((e,i)=>e.classList.toggle('on',i<=phase));$('guest').style.transition='transform 1.6s ease';$('guest').setAttribute('transform',`translate(${[20,115,138,138][phase]},0)`);$('bubble').setAttribute('opacity',phase===1?'1':'0');$('screen').setAttribute('opacity',phase>=2?'1':'0');$('check').setAttribute('opacity',phase===3?'1':'0');$('clerk').setAttribute('opacity',phase===0?'.45':'1')}function play(){clearInterval(timer);phase=0;draw();timer=setInterval(()=>{if(phase<3){phase++;draw()}else{clearInterval(timer)}},2100)}$('replay').onclick=play;$('next').onclick=()=>{index=(index+1)%words.length;play()};$('speak').onclick=()=>{if(!('speechSynthesis'in window))return alert('この端末では読み上げできません');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].en);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};play();
</script></body></html>
