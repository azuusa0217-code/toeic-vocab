ype=file]{display:none}input[type=number]{width:72px;padding:8px;border:1px solid #ccd6e4;border-radius:9px;font-size:16px}footer{text-align:center;font-size:12px;color:#708097;margin-top:30px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18314f;color:white;border-radius:10px;padding:10px 15px;display:none;max-width:90vw}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#1764b4}
.soundline{text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:-5px 0 17px}.ipa{color:#52627a;font-size:16px}.speak{background:#e6f2ff;color:#12549b;border:1px solid #c8ddf4;padding:9px 13px;font-size:14px;min-width:0}.speedbar{display:flex;gap:8px;justify-content:center;margin:5px 0 18px}.speedbar button{font-size:12px;padding:8px 13px}.speedbar .chosen{background:#1764b4;color:#fff}.speedbar .unchosen{background:#e7edf5;color:#18314f}</style></head><body><header><div style="max-width:700px;margin:auto"><h1>TOEIC 単語トレーニング</h1><div style="font-size:13px;color:#c4d7ee">意味 → 例文 → 思い出す。毎日少しずつ。</div></div></header><main><section id="home"></section><section id="study" class="hidden"></section><section id="settings"></section><footer>学習履歴はこの端末のブラウザに保存されます。定期的にバックアップしてください。</footer></main><div id="toast" role="status"></div><script>

const vocab=raw.split('\n').map((r,i)=>{const [en,ja,ex,ej]=r.split('|');return {id:i,en,ja,ex,ej}});const KEY='toeic-vocab-v1';const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const days=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!state||!Array.isArray(state.cards))state={cards:[],log:[],settings:{batch:20}};state.settings ||= {batch:20};state.log ||= [];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存に失敗しました。バックアップしてください。')}}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function card(id){return state.cards.find(x=>x.id===id)}function todayReview(c){const age=days(c.cycle,today());return age<=1||c.weak}function weakCount(){return state.cards.filter(c=>c.weak).length}function pending(){return state.cards.filter(c=>todayReview(c)&&c.lastReview!==today())}function newCount(){return state.cards.filter(c=>c.cycle===today()).length}function nextFresh(){return vocab.filter(v=>!card(v.id)).slice(0,state.settings.batch||20)}function batchWeak(){return state.cards.filter(c=>c.weak).sort((a,b)=>a.cycle.localeCompare(b.cycle)).slice(0,state.settings.batch||20)}let session=null;
function render(){document.getElementById('home').classList.toggle('hidden',!!session);document.getElementById('study').classList.toggle('hidden',!session);if(session){renderSession();return}let p=pending(),w=weakCount(),fresh=nextFresh(),limit=state.settings.batch||20;let html=`<div class="panel"><div class="topline"><h2>今日の学習</h2><span class="tag">${today()}</span></div><div class="grid"><div class="metric"><b>${p.length}</b><span>復習待ち</span></div><div class="metric"><b>${w}</b><span>苦手単語</span></div><div class="metric"><b>${state.cards.length}</b><span>学習済み</span></div></div></div>`;
if(p.length)html+=`<div class="panel"><h2>① 今日の復習</h2><p class="note">学習当日と翌日は全問、翌々日以降は苦手単語のみ。1日1回の判定です。</p><button style="width:100%" onclick="startReview()">復習を始める（${p.length}語）</button></div>`;
if(w>=limit){let b=batchWeak();html+=`<div class="panel"><h2>② 苦手単語の再学習</h2><div class="notice">苦手単語が${w}語。新しい単語の追加を一時停止しています。</div><p class="note">苦手から${b.length}語を選び、3段階で学び直します。前日分の復習は別途続きます。</p><button style="width:100%" onclick="startLearning('weak')">苦手${b.length}語を再学習</button></div>`}else if(fresh.length){html+=`<div class="panel"><h2>② 新しい単語</h2><p class="note">20語単位で追加できます。調子がよければ同じ日にもう1セット。</p><button style="width:100%" onclick="startLearning('new')">新規${fresh.length}語を学習</button></div>`}else html+=`<div class="panel"><h2>新規単語は終了</h2><p class="note">収録済みの${vocab.length}語を学習しました。苦手単語の復習を続けられます。</p></div>`;
html+=`<div class="panel"><h2>学習履歴</h2>${state.log.length?state.log.slice(-7).reverse().map(x=>`<div class="listrow"><span>${x.date}　${x.type}</span><span class="tag">${x.count}語${x.missed===undefined?'':`・不正解${x.missed}`}</span></div>`).join(''):'<p class="note">まだ学習記録がありません。</p>'}</div>`;
document.getElementById('home').innerHTML=html;document.getElementById('settings').innerHTML=`<div class="panel"><h2>設定とバックアップ</h2><p class="note">苦手単語が20語以上なら、新規学習の代わりに苦手20語を再学習します。学習当日と翌日は全問復習し、3日目以降は苦手だけを出題します。</p><div class="buttons"><button class="secondary" onclick="exportData()">履歴を保存（JSON）</button><label class="filebtn secondary" style="text-align:center;cursor:pointer">履歴を復元<input type="file" accept="application/json,.json" onchange="importData(event)"></label></div><p class="note">端末変更・ブラウザデータ削除に備え、週1回程度バックアップをおすすめします。ファイルから開いた場合、iPhoneの環境によって保存が継続しないことがあります。</p><button class="danger" onclick="resetAll()">全履歴を消去</button></div>`}
const IPA={available:'/əˈveɪləbəl/',require:'/rɪˈkwaɪər/',provide:'/prəˈvaɪd/',confirm:'/kənˈfɜːrm/',increase:'/ɪnˈkriːs/',reduce:'/rɪˈduːs/',attend:'/əˈtend/',purchase:'/ˈpɜːrtʃəs/',delay:'/dɪˈleɪ/',improve:'/ɪmˈpruːv/'};
let speechRate=Number(localStorage.getItem('toeic-speech-rate')||'0.9');
function setSpeechRate(rate){speechRate=rate;try{localStorage.setItem('toeic-speech-rate',String(rate))}catch(e){}render()}
function speak(text){if(!('speechSynthesis' in window)){alert('このブラウザは音声読み上げに対応していません。Safariで開いてください。');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=speechRate;u.pitch=1;const vs=speechSynthesis.getVoices();const voice=vs.find(x=>x.lang.toLowerCase()==='en-us'&&x.localService)||vs.find(x=>x.lang.toLowerCase().startsWith('en'));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){alert('音声を再生できませんでした。iPhoneの音量と消音設定を確認してください。')}}
function speechControls(v){return `<div class="soundline">${IPA[v.en]?`<span class="ipa">${IPA[v.en]}</span>`:''}<button class="speak" onclick="speak(vocab[${v.id}].en)">🔊 単語</button></div><div class="speedbar"><span class="muted" style="align-self:center">再生速度</span><button class="${speechRate===0.9?'chosen':'unchosen'}" onclick="setSpeechRate(0.9)">通常</button><button class="${speechRate===0.7?'chosen':'unchosen'}" onclick="setSpeechRate(0.7)">ゆっくり</button></div>`}
function exampleAudio(v){return `<div class="example">${v.ex} <button class="speak" onclick="speak(vocab[${v.id}].ex)" aria-label="例文を読み上げ">🔊 例文</button><br>${v.ej}</div>`}
function startLearning(kind){const vs=kind==='weak'?batchWeak().map(c=>vocab[c.id]):nextFresh();if(!vs.length)return;session={type:'learn',kind,ids:vs.map(x=>x.id),idx:0,step:0,reveal:false,missed:new Set(),completed:[],started:today()};render()}
function startReview(){const cs=pending();if(!cs.length)return;session={type:'review',ids:cs.map(c=>c.id),idx:0,reveal:false,missed:new Set(),completed:[],started:today()};render()}
function renderSession(){let s=session,v=vocab[s.ids[s.idx]],isLearn=s.type==='learn',stage=isLearn?s.step:2;let label=isLearn?['STEP 1・意味を知る','STEP 2・例文で理解','STEP 3・思い出す'][stage]:'復習テスト';let body=`<div class="panel"><div class="topline"><span class="stage">${label}</span><span class="muted">${s.idx+1} / ${s.ids.length}</span></div><div class="progress"><div class="bar" style="width:${((s.idx+(stage+1)/3)/s.ids.length)*100}%"></div></div><div class="big">${v.en}</div>${speechControls(v)}`;
if(isLearn&&stage===0)body+=`<div class="meaning">${v.ja}</div><button style="width:100%" onclick="nextStep()">例文へ進む →</button>`;
else if(isLearn&&stage===1)body+=`<div class="meaning">${v.ja}</div>${exampleAudio(v)}<button style="width:100%" onclick="nextStep()">意味を思い出す →</button>`;
else if(!s.reveal)body+=`<p class="note" style="text-align:center">答えを見る前に、日本語の意味を思い出してください。</p><button style="width:100%" onclick="showAnswer()">答えを見る</button>`;
else body+=`<div class="meaning">${v.ja}</div>${exampleAudio(v)}<div class="buttons"><button class="secondary" onclick="answer(false)">× 覚えていない</button><button onclick="answer(true)">✓ 覚えていた</button></div>`;
body+=`<div style="margin-top:18px"><button class="outline" onclick="quitSession()">中断してホームへ</button></div></div>`;document.getElementById('study').innerHTML=body}
function nextStep(){if(session.step<2){session.step++;render()}}function showAnswer(){session.reveal=true;render()}
function answer(ok){let s=session,id=s.ids[s.idx],c=card(id);if(s.type==='review'){if(c){c.lastReview=today();c.weak=!ok;c.lastAnswer=ok}}else{if(!c){c={id,cycle:today(),weak:!ok,lastReview:today(),lastAnswer:ok};state.cards.push(c)}else{c.cycle=today();c.lastReview=today();c.weak=!ok;c.lastAnswer=ok}}if(!ok)s.missed.add(id);s.completed.push(id);save();if(s.idx+1<s.ids.length){s.idx++;s.step=0;s.reveal=false;render()}else{let n=s.ids.length,m=s.missed.size;state.log.push({date:today(),type:s.type==='review'?'復習':s.kind==='weak'?'苦手再学習':'新規学習',count:n,missed:m});save();session=null;render();toast(`${n}語完了！ 間違い${m}語`)}}
function quitSession(){if(!confirm('学習を中断しますか？ 回答済みの結果は保存されています。'))return;session=null;render()}
function exportData(){const b=new Blob([JSON.stringify({format:'toeic-vocab-v1',saved:today(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='toeic-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(ev){const f=ev.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.format!=='toeic-vocab-v1'||!Array.isArray(d.state?.cards)||!Array.isArray(d.state?.log))throw Error('形式が違います');if(!confirm('現在の学習履歴をバックアップの内容で上書きしますか？'))return;state=d.state;save();session=null;render();toast('復元しました')}catch(e){alert('読み込めませんでした：'+e.message)}ev.target.value=''}
function resetAll(){if(confirm('すべての学習履歴を削除します。元に戻せません。よろしいですか？')){localStorage.removeItem(KEY);state={cards:[],log:[],settings:{batch:20}};session=null;render()}}
render();
</script></body></html>
