<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC 動く例文・試作版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1b2737;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:18px 16px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:21px;margin:8px 0}small,.muted{color:#66778b}.pill{font-size:11px;padding:6px 9px;background:#e5f4ec;border-radius:40px;color:#196b45}.panel{background:white;border:1px solid #e4e9f0;border-radius:20px;padding:18px;box-shadow:0 8px 24px #24344d0a;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:center}.word{font-size:31px;font-weight:750;margin:10px 0 3px}.phon{color:#718094;font-size:14px}.meaning{font-weight:700;margin-top:12px}.scene{position:relative;overflow:hidden;height:220px;background:linear-gradient(#dceefa 0 72%,#c8d8ca 72%);border-radius:15px;margin-top:16px}.scene:after{content:'';position:absolute;bottom:0;width:100%;height:2px;background:#aac5a9}.sun{position:absolute;top:19px;right:22px;width:39px;height:39px;border-radius:50%;background:#ffe18d}.floor{position:absolute;bottom:0;width:100%;height:61px;background:#d5e4d7}.desk{position:absolute;left:14%;bottom:32px;width:72%;height:12px;background:#987357;border-radius:6px}.desk:after{content:'';position:absolute;top:10px;left:8%;height:40px;width:8px;background:#987357;box-shadow:210px 0 #987357}.person{position:absolute;left:15%;bottom:47px;width:66px;height:104px;transform-origin:50% 95%}.head{position:absolute;top:0;left:18px;width:36px;height:36px;background:#f4c9a3;border-radius:50%;border:2px solid #c8987a}.hair{position:absolute;top:-4px;left:17px;width:39px;height:17px;background:#3c485b;border-radius:18px 18px 7px 6px}.body{position:absolute;top:36px;left:8px;width:54px;height:61px;border-radius:18px 18px 5px 5px;background:#527fbb}.arm{position:absolute;top:49px;left:50px;width:12px;height:43px;border-radius:9px;background:#f4c9a3;transform-origin:top;animation:wave 2.2s ease-in-out infinite alternate}.person.two{left:auto;right:14%;transform:scaleX(-1)}.person.two .body{background:#d47786}.item{position:absolute;bottom:49px;left:46%;font-size:46px;transform:translateX(-50%);animation:bob 2.3s ease-in-out infinite}.bubble{position:absolute;top:18px;left:17%;max-width:65%;padding:10px 12px;background:white;border-radius:16px;font-size:15px;font-weight:700;box-shadow:0 4px 12px #0001;animation:appear 3.5s ease-in-out infinite}.bubble:after{content:'';position:absolute;bottom:-9px;left:22px;border:10px solid transparent;border-top-color:white;border-bottom:0}.progress{height:5px;background:#ffffff80;position:absolute;bottom:0;left:0;right:0;z-index:4}.progress:before{content:'';display:block;background:#4a83bd;height:100%;width:0;animation:progress 7s linear infinite}.scene.paused *{animation-play-state:paused!important}.scene.paused .progress:before{animation-play-state:paused!important}@keyframes progress{to{width:100%}}@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-11px)}}@keyframes wave{from{transform:rotate(10deg)}to{transform:rotate(-30deg)}}@keyframes appear{0%,12%,94%,100%{opacity:.2;transform:translateY(5px)}20%,86%{opacity:1;transform:translateY(0)}}.english{font-size:19px;font-weight:650;line-height:1.5;margin:16px 0 8px}.jp{color:#4d5f73;line-height:1.6}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;background:#e8eef6;color:#24415e;cursor:pointer}button.primary{background:#2563a5;color:white}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.nav button{min-width:105px}.note{font-size:13px;line-height:1.7;color:#617287}.scene[data-kind=meeting]{background:linear-gradient(#dce5fb 0 72%,#d5d9e5 72%)}.scene[data-kind=office]{background:linear-gradient(#e8f1fa 0 72%,#c7dbd4 72%)}.scene[data-kind=shop]{background:linear-gradient(#fff0d9 0 72%,#e2d5c2 72%)}.scene[data-kind=travel]{background:linear-gradient(#d9f0fb 0 72%,#c9d7bd 72%)}
</style></head><body><main class="wrap"><header><div><small>TOEIC 400 → 600</small><h1>動く例文・お試し版</h1></div><span class="pill">学習履歴に影響なし</span></header><p class="note">10語の例文を約7秒のループアニメで表現します。イラストと英文の組み合わせが覚えやすいか試せます。</p><section class="panel"><div class="top"><small id="count">1 / 10</small><small>アニメーション試作</small></div><div class="word" id="word"></div><div class="phon" id="phon"></div><div class="meaning" id="meaning"></div><div class="scene" id="scene"><div class="sun"></div><div class="floor"></div><div class="desk"></div><div class="person"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="arm"></div></div><div class="person two"><div class="head"></div><div class="hair"></div><div class="body"></div><div class="arm"></div></div><div class="item" id="item"></div><div class="bubble" id="bubble"></div><div class="progress"></div></div><div class="english" id="en"></div><div class="jp" id="jp"></div><div class="buttons"><button id="play">⏸ 一時停止</button><button id="speak">🔊 英文を聞く</button></div><div class="nav"><button id="prev">← 前の単語</button><strong id="page">1 / 10</strong><button class="primary" id="next">次の単語 →</button></div></section><p class="note">このページは別ファイルで動作し、保存データの読み書きを一切行いません。元のアプリの単語・復習履歴・習得済み記録は変更しません。音声は端末の読み上げ機能を使用します。実際の動画ファイルではなく、CSSで動く軽量アニメーションです。</p></main><script>
const cards=[
{w:'available',p:'/əˈveɪləbəl/',m:'形容詞：利用できる・空いている',e:'Is the meeting room available at three?',j:'会議室は3時に空いていますか？',kind:'meeting',icon:'🗓️',bubble:'3:00 ✓'},
{w:'require',p:'/rɪˈkwaɪər/',m:'動詞：必要とする',e:'This position requires computer skills.',j:'この職種にはパソコンのスキルが必要です。',kind:'office',icon:'💻',bubble:'Skills needed!'},
{w:'provide',p:'/prəˈvaɪd/',m:'動詞：提供する',e:'The hotel provides free breakfast.',j:'そのホテルは無料の朝食を提供します。',kind:'travel',icon:'🥐',bubble:'Breakfast!'},
{w:'confirm',p:'/kənˈfɜːrm/',m:'動詞：確認する',e:'Please confirm your reservation by Friday.',j:'金曜日までに予約内容を確認してください。',kind:'travel',icon:'📋',bubble:'Confirmed ✓'},
{w:'increase',p:'/ɪnˈkriːs/',m:'動詞：増える・増やす',e:'Sales increased during the summer.',j:'夏の間に売上が増加しました。',kind:'shop',icon:'📈',bubble:'Sales ↑'},
{w:'reduce',p:'/rɪˈduːs/',m:'動詞：減らす',e:'We need to reduce operating costs.',j:'運営費を削減する必要があります。',kind:'office',icon:'📉',bubble:'Costs ↓'},
{w:'attend',p:'/əˈtend/',m:'動詞：出席する',e:'All employees must attend the meeting.',j:'全従業員は会議に出席しなければなりません。',kind:'meeting',icon:'👥',bubble:'Meeting today'},
{w:'purchase',p:'/ˈpɜːrtʃəs/',m:'動詞・名詞：購入する・購入',e:'Customers can purchase tickets online.',j:'顧客はオンラインでチケットを購入できます。',kind:'shop',icon:'🎫',bubble:'Order complete!'},
{w:'delay',p:'/dɪˈleɪ/',m:'動詞・名詞：遅れる・遅延',e:'The train was delayed by heavy rain.',j:'大雨のため列車が遅れました。',kind:'travel',icon:'🚆',bubble:'Delayed!'},
{w:'improve',p:'/ɪmˈpruːv/',m:'動詞：改善する・上達する',e:'The company plans to improve customer service.',j:'その会社は顧客サービスの改善を計画しています。',kind:'office',icon:'⭐',bubble:'Better service!'}];
let i=0,paused=false;const $=id=>document.getElementById(id);function render(){const c=cards[i];$('word').textContent=c.w;$('phon').textContent=c.p;$('meaning').textContent=c.m;$('en').textContent=c.e;$('jp').textContent=c.j;$('bubble').textContent=c.bubble;$('item').textContent=c.icon;$('scene').dataset.kind=c.kind;$('count').textContent=`${i+1} / ${cards.length}`;$('page').textContent=`${i+1} / ${cards.length}`;$('scene').classList.remove('paused');void $('scene').offsetWidth;paused=false;$('play').textContent='⏸ 一時停止';speechSynthesis?.cancel?.()}$('prev').onclick=()=>{i=(i+cards.length-1)%cards.length;render()};$('next').onclick=()=>{i=(i+1)%cards.length;render()};$('play').onclick=()=>{paused=!paused;$('scene').classList.toggle('paused',paused);$('play').textContent=paused?'▶ 再生':'⏸ 一時停止'};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('このブラウザは読み上げに対応していません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[i].e);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)};render();
</script></body></html>
